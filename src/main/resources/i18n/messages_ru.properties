base.type.integer.code=Код целого числа, предназначенный для обозначения дискретных или порядковых значений без дробной части.
base.type.double.code=Код числа с плавающей точкой, предназначенный для хранения количественных или вычисляемых данных с дробной частью.
base.type.string.code=Код строки, предназначенный для хранения символьных обозначений, идентификаторов или текстовых ключей.
base.type.boolean.code=Код логического значения, предназначенный для представления бинарных состояний, таких как «да» или «нет».

custom.type.uuid.code=Код строки, предназначенный для представления уникальных идентификаторов.
custom.type.datetime.code=Код строки, предназначенный для представления времени в формате DATETIME.
custom.type.time.code=Код строки, предназначенный для преставления времени в формате TIME.
custom.type.date.code=Код строки, предназначенный для представления времени в формате DATE.
custom.type.snils.code=Код целого числа, предназначенный для представления СНИЛС.
custom.type.inn.org.code=Код целого числа, предназначенный для представления организационного ИНН.
custom.type.inn.pers.code=Код целого числа, предназначенный для представления персонального ИНН.
custom.type.ogrn.code=Код целого числа, предназначенныйд для представления ОГРН.
custom.type.imei.code=Код строки, предназначенный для представления IMEI - международного идентификатора мобильного оборудования (15 цифр). Если поле [valid] равно true, последняя цифра - корректный контрольный разряд по алгоритму Луна.
custom.type.zoned.datetime.code=Код строки, предназначенный для представления даты и времени с часовым поясом в формате ISO-8601. Часовой пояс значений берётся из поля [start].
custom.type.zone.id.code=Код строки, предназначенный для представления идентификаторов часовых поясов.
custom.type.decimal.code=Код строки, предназначенный для представления точных десятичных чисел с фиксированным количеством знаков после запятой. Количество знаков после запятой берётся из полей [start], [end] и [step].
custom.type.card.mir.code=Код строки, предназначенный для представления номеров карт платёжной системы «Мир» (16 цифр). Если поле [valid] равно true, последняя цифра — корректный контрольный разряд по алгоритму Луна.
custom.type.card.visa.code=Код строки, предназначенный для представления номеров карт платёжной системы Visa (16 цифр). Если поле [valid] равно true, последняя цифра — корректный контрольный разряд по алгоритму Луна.
custom.type.card.mastercard.code=Код строки, предназначенный для представления номеров карт платёжной системы Mastercard (16 цифр). Если поле [valid] равно true, последняя цифра — корректный контрольный разряд по алгоритму Луна.
custom.type.kpp.code=Код строки, предназначенный для представления КПП — кода причины постановки на учёт организации (9 символов).
custom.type.ogrnip.code=Код строки, предназначенный для представления ОГРНИП — основного государственного регистрационного номера индивидуального предпринимателя (15 цифр). Если поле [valid] равно true, последняя цифра — корректный контрольный разряд.
custom.type.okpo.code=Код строки, предназначенный для представления ОКПО организации (8 цифр). Если поле [valid] равно true, последняя цифра — корректный контрольный разряд.
custom.type.bik.code=Код строки, предназначенный для представления БИК — банковского идентификационного кода (9 цифр).
custom.type.bank.account.code=Код строки, предназначенный для представления номеров расчётных счетов (20 цифр). Если поле [valid] равно true, контрольный ключ рассчитывается под БИК, переданный в поле [start].
custom.type.okved.code=Код строки, предназначенный для представления ОКВЭД — кода вида экономической деятельности (от XX.XX до XX.XX.XX).
custom.type.oktmo.code=Код строки, предназначенный для представления ОКТМО — кода муниципального образования (8 цифр).
custom.type.okato.code=Код строки, предназначенный для представления ОКАТО — кода населённого пункта (11 цифр).
custom.type.kbk.code=Код строки, предназначенный для представления КБК — кода бюджетной классификации доходов (20 цифр).
custom.type.oms.code=Код строки, предназначенный для представления номеров полисов ОМС единого образца (16 цифр). Если поле [valid] равно true, последняя цифра — корректный контрольный разряд.
custom.type.sts.code=Код строки, предназначенный для представления СТС — серии и номера свидетельства о регистрации транспортного средства (10 символов).
custom.type.pts.code=Код строки, предназначенный для представления ПТС — серии и номера паспорта транспортного средства (10 символов).


constant.strategy.description=Генерирует данные в виде константы, указанной пользователем.
algorithm.strategy.description=Алгоритмическая генерация позволяет точечно настраивать для некоторых типов данных диапазон генерации значений через параметры [start], [end] и [step]
dictionary.strategy.description=Генерирует данные исходя из переданных элементов словарей
regexp.strategy.description=Генерирует данные на основе переданных регулярных выражений
faker.strategy.description=Режим аналогичен алгоритмическому режиму, разница в том, что этот режим поддерживает генерацию доменов, которые отсутствуют в алгоритмическом режиме (например, "IPv4", "EAN8" и т.д. Смотрите список в "/v1/topics"). Но в этом режиме граница генерации не может быть настроена с помощью полей [start], [end], [step].
expression.strategy.description=Вычисляет значения колонки по другим колонкам той же строки с помощью выражения из поля [expression]. На колонки ссылаются по имени: #price * #qty. Порядок вычисления определяется по ссылкам между колонками.

converter.abs.code=Модуль числа: отрицательные числа становятся положительными.
converter.ceil.code=Округление вверх до ближайшего целого.
converter.cos.code=Косинус. Число задаёт угол в радианах.
converter.sin.code=Синус. Число задаёт угол в радианах.
converter.divide.code=Деление на число из аргумента. Аргумент не может быть равен 0. Для int дробная часть результата отбрасывается.
converter.multiply.code=Умножение на число из аргумента. Для int дробная часть результата отбрасывается.
converter.floor.code=Округление вниз до ближайшего целого.
converter.minus.code=Вычитание числа из аргумента. Для int дробная часть результата отбрасывается.
converter.plus.code=Сложение с числом из аргумента. Для int дробная часть результата отбрасывается.
converter.pow.code=Возведение в степень из аргумента. Для int дробная часть результата отбрасывается.
converter.round.code=Округление до количества знаков после запятой из аргумента.
converter.log.code=Натуральный логарифм. Для 0 результат равен -Infinity, для отрицательных чисел — NaN. Аргумент обязателен, но в вычислении не участвует.
converter.log10.code=Десятичный логарифм. Для 0 результат равен -Infinity, для отрицательных чисел — NaN. Аргумент обязателен, но в вычислении не участвует.
converter.exp.code=Экспонента: число e в степени значения.
converter.mod.code=Остаток от деления на число из аргумента.
converter.tan.code=Тангенс. Число задаёт угол в радианах.
converter.cot.code=Котангенс, то есть 1 / tan. Число задаёт угол в радианах.
converter.arcsin.code=Арксинус в радианах. Определён для чисел от -1 до 1, для остальных результат равен NaN.
converter.arccos.code=Арккосинус в радианах. Определён для чисел от -1 до 1, для остальных результат равен NaN.
converter.arctan.code=Арктангенс в радианах.
converter.zscore.code=Стандартизация колонки: из значения вычитается среднее по колонке, разность делится на стандартное отклонение. Если все значения одинаковы, колонка заполняется нулями.
converter.minMaxScaling.code=Приведение колонки к диапазону от 0 до 1: наименьшее значение становится 0, наибольшее — 1. Если все значения одинаковы, колонка заполняется нулями.
converter.negative.code=Смена знака числа.
converter.factorial.code=Факториал. Для чисел меньше 2 результат равен 1. Для чисел больше 20 результат не помещается в 64-битное целое и получается неверным.
converter.base64.code=Кодирование строки в Base64.
converter.lowerCase.code=Перевод строки в нижний регистр.
converter.replaceAll.code=Замена всех совпадений с регулярным выражением из первого аргумента на строку из второго аргумента. Во второй аргумент можно подставить группу выражения: $1.
converter.substring.code=Подстрока от индекса из первого аргумента (включительно) до индекса из второго (не включительно). Индексы начинаются с 0. Строка короче второго индекса приводит к ошибке генерации.
converter.trim.code=Удаление пробелов в начале и в конце строки.
converter.upperCase.code=Перевод строки в верхний регистр.
converter.format.code=Форматирование значений date, datetime и zoned_datetime по шаблону из аргумента, например dd.MM.yyyy. Значения в другом формате не меняются.
converter.capitalize.code=Первая буква строки становится заглавной, остальные символы не меняются.
converter.remove.whitespaces.code=Удаление всех пробельных символов, в том числе внутри строки.
converter.inversion.code=Смена регистра каждой буквы на противоположный.
converter.random.numeric.replace.code=Замена каждой цифры случайной цифрой. Остальные символы не меняются.
converter.random.russian.replace.code=Замена каждой русской буквы случайной русской буквой в любом регистре. Остальные символы не меняются.
converter.random.english.replace.code=Замена каждой латинской буквы случайной латинской буквой в любом регистре. Остальные символы не меняются.
converter.random.replace.code=Замена каждого символа случайной латинской буквой, цифрой или спецсимволом.
converter.add.before.code=Добавление текста из аргумента в начало строки.
converter.add.after.code=Добавление текста из аргумента в конец строки.
converter.repeat.code=Повтор строки столько раз, сколько указано в аргументе. По умолчанию 1, при 0 строка становится пустой.
converter.reverse.code=Символы строки в обратном порядке.
converter.translit.code=Транслитерация русских букв латиницей: Щукин превращается в Shchukin. Остальные символы не меняются.
converter.random.case.code=Случайная смена регистра каждой буквы.
converter.md5.code=Хеш MD5 строки в кодировке UTF-8: 32 шестнадцатеричных символа в нижнем регистре.
converter.sha256.code=Хеш SHA-256 строки в кодировке UTF-8: 64 шестнадцатеричных символа в нижнем регистре.
converter.mask.code=Замена середины строки символом маски. Аргументы: сколько символов оставить в начале и в конце (по умолчанию 0 и 0) и символ маски (по умолчанию *). Строка не длиннее оставляемой части не меняется.
converter.pad.left.code=Дополнение строки слева до длины из первого аргумента (от 0 до 1000) символом из второго аргумента (по умолчанию пробел). Строки не короче этой длины не меняются.
converter.pad.right.code=Дополнение строки справа до длины из первого аргумента (от 0 до 1000) символом из второго аргумента (по умолчанию пробел). Строки не короче этой длины не меняются.
converter.truncate.code=Обрезка строки до длины из аргумента. Строки не длиннее этой длины не меняются.
converter.shuffle.code=Перемешивание значений колонки в случайном порядке.
converter.to_null.code=Замена значений на null. Долю заменяемых значений задаёт поле probability.
converter.sort_asc.code=Сортировка значений колонки по возрастанию. Значения null оказываются в начале. Строки сравниваются посимвольно.
converter.sort_desc.code=Сортировка значений колонки по убыванию. Значения null оказываются в начале. Строки сравниваются посимвольно.
topic.name.last_name.code=Код топика, генерирующий фамилию в зависимости от языка.
topic.name.full_name.code=Код топика, генерирующий имя и фамилию в зависимости от языка.
topic.name.male_first_name.code=Код топика, генерирующий имя мужчины в зависимости от языка.
topic.name.female_first_name.code=Код топика, генерирующий имя женщины в зависимости от языка.
topic.barcode.ean8.code=Код топика, генерирующий штрих-код по стандарту EAN8.
topic.barcode.ean13.code=Код топика, генерирующий штрихкод по стандарту EAN13.
topic.barcode.gtin8.code=Код топика, генерирующий штрихкод по стандарту GTIN8.
topic.barcode.gtin12.code=Код топика, генерирующий штрихкод по стандарту GTIN12.
topic.phone.number.code=Код топика, генерирующий номер телефона в зависимости от языка.
topic.phone.cell_number.code=Код топика, генерирующий номер сотового телефона в зависимости от языка.
topic.phone.international_number.code=Код топика, генерирующий международный номер телефона в зависимости.
topic.finance.iban.code=Код топика, генерирующий IBAN.
topic.finance.bic.code=Код топика, генерирующий BIC.
topic.internet.ip_v4.code=Код топика, генерирующий IPv4-адрес.
topic.internet.ip_v6.code=Код топика, генерирующий IPv6-адрес.
topic.internet.mac.code=Код топика, генерирующий MAC-адрес.
topic.internet.url.code=Код топика, генерирующий URL.
topic.internet.password.code=Код топика, генерирующий пароли.
topic.email.code=Код топика, генерирующий email-почту.
topic.vehicle.vin.code=Код топика, генерируйщий VIN.
topic.vehicle.number.code=Код топика, генерируйщий тестовый номер автомобиля.
topic.passport.international.russian.code=Код топика, генерирующий тестовый российский загранпаспорт.
topic.passport.international.us.code=Код топика, генерирующий тестовый американский загранпаспорт.
topic.passport.international.common.code=Код топика, генерирующий тестовый международный загранпаспорт.

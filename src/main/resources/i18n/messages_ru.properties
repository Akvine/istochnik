topic.passport.us.code=Код топика, генерирующий тестовый американский паспорт.
topic.text.code=Код топика, генерирующий текст-заполнитель (lorem ipsum) заданной длины. Длина в символах задаётся полем length, по умолчанию 100.
topic.geo.coordinates.code=Код топика, генерирующий координаты точки: широту и долготу через запятую.


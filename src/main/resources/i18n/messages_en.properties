constant.strategy.description=Generates data as a constant specified by the user.
algorithm.strategy.description=Algorithmic generation allows point-by-point adjustment of the range of value generation for some base and custom data types using the [start], [end] and [step] parameters.
dictionary.strategy.description=Generates data based on the passed dictionary elements in field [dictionaries]
regexp.strategy.description=Generates data based on the passed regular expressions
faker.strategy.description=The mode is similar to algorithmic mode, the difference is that this mode supports domain generation, which is not present in algorithmic mode (ex. "IPv4", "EAN8" and etc. See list in endpoint "/v1/topics"). But it cannot be configured by fields [start], [end], [step].
expression.strategy.description=Calculates column values from other columns of the same row using the expression in field [expression]. Columns are referenced by name: #price * #qty. The calculation order is derived from references between columns.
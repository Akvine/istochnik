base.type.integer.code=Code in the form of an integer, intended to represent discrete or ordinal values without fractional parts.
base.type.double.code=Code in the form of a floating-point number, intended for storing quantitative or computed data with fractional parts.
base.type.string.code=Code in the form of a string, intended for storing symbolic labels, identifiers, or textual keys.
base.type.boolean.code=Code in the form of a boolean value, intended to represent binary states such as "yes" or "no".

custom.type.uuid.code=Code in the form of a string intended to represent unique identifiers.
custom.type.datetime.code=Code in the form of a string intended for representing time in the DATETIME format.
custom.type.time.code=Code in the form of a string intended for representing time in the TIME format.
custom.type.date.code=Code in the form of a string intended for representing time in the DATE format.
custom.type.snils.code=Код целого числа, предназначенный для представления СНИЛС.
custom.type.inn.org.code=Код целого числа, предназначенный для представления организационного ИНН.
custom.type.inn.pers.code=Код целого числа, предназначенный для представления персонального ИНН.
custom.type.ogrn.code=Код целого числа, предназначенныйд для представления ОГРН.
custom.type.imei.code=Code in the form of a string intended for representing IMEI - International Mobile Equipment Identity (15 digits). If the [valid] field is true, the last digit is a valid check digit according to the Luhn algorithm.
custom.type.zoned.datetime.code=Code in the form of a string intended for representing date and time with a time zone in the ISO-8601 format. The time zone of generated values is taken from the field [start].
custom.type.zone.id.code=Code in the form of a string intended for representing time zone identifiers.
custom.type.decimal.code=Code in the form of a string intended for representing exact decimal numbers with a fixed number of fraction digits. The number of fraction digits is taken from the fields [start], [end] and [step].
custom.type.card.mir.code=Code in the form of a string intended for representing Mir payment system card numbers (16 digits). If the field [valid] is true, the last digit is a correct Luhn check digit.
custom.type.card.visa.code=Code in the form of a string intended for representing Visa payment system card numbers (16 digits). If the field [valid] is true, the last digit is a correct Luhn check digit.
custom.type.card.mastercard.code=Code in the form of a string intended for representing Mastercard payment system card numbers (16 digits). If the field [valid] is true, the last digit is a correct Luhn check digit.
custom.type.kpp.code=Code in the form of a string intended for representing KPP - tax registration reason code of an organization (9 characters).
custom.type.ogrnip.code=Code in the form of a string intended for representing OGRNIP - primary state registration number of an individual entrepreneur (15 digits). If the field [valid] is true, the last digit is a correct check digit.
custom.type.okpo.code=Code in the form of a string intended for representing OKPO of an organization (8 digits). If the field [valid] is true, the last digit is a correct check digit.
custom.type.bik.code=Code in the form of a string intended for representing BIK - bank identification code (9 digits).
custom.type.bank.account.code=Code in the form of a string intended for representing bank settlement account numbers (20 digits). If the field [valid] is true, the check key is calculated for the BIK passed in the field [start].
custom.type.okved.code=Code in the form of a string intended for representing OKVED - economic activity code (from XX.XX to XX.XX.XX).
custom.type.oktmo.code=Code in the form of a string intended for representing OKTMO - municipal territory code (8 digits).
custom.type.okato.code=Code in the form of a string intended for representing OKATO - locality code (11 digits).
custom.type.kbk.code=Code in the form of a string intended for representing KBK - budget classification code of revenues (20 digits).
custom.type.oms.code=Code in the form of a string intended for representing compulsory medical insurance (OMS) policy numbers (16 digits). If the field [valid] is true, the last digit is a correct check digit.
custom.type.sts.code=Code in the form of a string intended for representing STS - series and number of a vehicle registration certificate (10 characters).
custom.type.pts.code=Code in the form of a string intended for representing PTS - series and number of a vehicle passport (10 characters).


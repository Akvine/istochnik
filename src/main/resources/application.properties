###########################
#### Server properties ####
###########################
spring.application.name=istochnik
server.port=${SERVER_PORT}

###########################
#### Eureka properties ####
###########################
eureka.client.service-url.defaultZone=${EUREKA_URL}
eureka.client.enabled=${EUREKA_ENABLED}

############################
#### Security Properties ###
############################
security.enabled = ${SECURITY_ENABLED}
#spring.security.oauth2.resourceserver.jwt.issuer-uri = ${OAUTH2_PROVIDER_ISSUER_URI}
#spring.security.oauth2.resourceserver.jwt.jwk-set-uri = ${OAUTH2_PROVIDER_JWK_SET_URI}

#############################
#### RabbitMQ Properties ####
#############################
rabbitmq.enabled=${RABBITMQ_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}
# One unacknowledged request per consumer: generation is heavy, the rest stays in the queue for other instances
spring.rabbitmq.listener.simple.prefetch=1
rabbitmq.generation.request-queue=istochnik.generation.requests
rabbitmq.generation.response-queue=istochnik.generation.responses
rabbitmq.generation.max-file-size-kb=10240
# The broker is not checked by the health indicator while RabbitMQ is disabled
management.health.rabbit.enabled=${rabbitmq.enabled}

############################
#### Metrics Properties ####
############################
metrics.enabled=${METRICS_ENABLED:false}
# Actuator properties below follow metrics.enabled: without it nothing is collected and /actuator is not available
management.endpoints.web.exposure.include=prometheus
management.endpoints.web.discovery.enabled=${metrics.enabled}
management.prometheus.metrics.export.enabled=${metrics.enabled}
management.metrics.enable.all=${metrics.enabled}
management.metrics.tags.application=${spring.application.name}

######################################
### i18n / Localization Properties ###
######################################
default.language=en
default.encoding=utf8
localization.basename.messages.path=classpath:i18n/messages

############################
##### Custom Properties ####
############################
max.generation.rows.size=100000
max.generation.columns.size=200
max.generation.attempts=100
max.dictionaries.per.column=10
max.dictionary.elements.count=10000
max.faker.text.length=1000
randomizer.seed=
sql.insert.batch.size=1000

##################################
##### Rate Limiter Properties ####
##################################
generation.rate.limiter.enabled=true
generation.rate.limiter.limit-for-period=20
generation.rate.limiter.refresh-period-seconds=1

##############################
#### Experimental features ###
##############################
generation.expression.enabled=true
schema.conversion.enabled=true

########################################
##### Expression Columns Properties ####
########################################
generation.expression.max-length=1000
generation.expression.max-result-length=1000

########################################
##### Schema Conversion Properties #####
########################################
schema.conversion.max-file-size-kb=512

##############################
##### Parallel Properties ####
##############################
parallel.executor.threads-count=100
parallel.executor.queue-capacity=1000

############################
#### Logging Properties ####
############################
log.total.generation.data.benchmark.enabled=false
log.column.generation.data.benchmark.enabled=false